version: '3.8'

services:

  rabbitmq:
    image: rabbitmq:3-management

    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin

    restart: unless-stopped

  rabbitmq-setup:
    build:
      context: ./RabbitMQ
      dockerfile: Dockerfile

    container_name: rabbitmq-setup

    depends_on:
      - rabbitmq

    restart: "no"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  servicio_puente:
    build:
      context: ./ServicioPuente
      dockerfile: Dockerfile
    environment:
      - MQTT_BROKER=mosquitto
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - mosquitto
      - rabbitmq
    restart: always

volumes:
  mariadb_data:
