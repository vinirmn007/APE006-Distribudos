version: '3.8'

services:
  mariadb:
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autos_db
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: always

  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: always

  consumidor:
    build:
      context: ./BrokerMosquitto
      dockerfile: Dockerfile
    environment:
      - MQTT_BROKER=mosquitto
    volumes:
      - ./BrokerMosquitto/data:/app/data
    depends_on:
      - mosquitto
    restart: always

  servicio_autos:
    build:
      context: ./ServicioAutos
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_HOST=mariadb
      - DB_NAME=autos_db
      - MQTT_BROKER=mosquitto
    depends_on:
      - mariadb
      - mosquitto
    restart: always

volumes:
  mariadb_data:
